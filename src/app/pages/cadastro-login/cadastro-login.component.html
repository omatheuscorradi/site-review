<div class="cadastro-container">
  <div class="logo">
    <img src="../../../assets/img/logo.png" alt="Site Review">
  </div>

  <input type="text" [(ngModel)]="nome" placeholder="Digite seu nome" />
  <input type="email" [(ngModel)]="email" placeholder="Digite seu email" />
  <input type="password" [(ngModel)]="senha" placeholder="Crie sua senha" />
  <input type="password" [(ngModel)]="confirmSenha" placeholder="Confirme sua senha" />

  <button type="submit" class="btn-primary" (click)="cadastrar()">
    Criar Cadastro
  </button>

  <div class="rodape">
    *Ao clicar em criar cadastro, você confirma a utilização de seus dados.
  </div>
</div>
